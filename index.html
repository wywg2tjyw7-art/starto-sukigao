<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STARTO 好き顔♡9選</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#403947}
body{background:linear-gradient(145deg,#fff6fb 0%,#f4f0ff 100%);}
button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{width:100%;max-width:700px;margin:auto;padding:18px 14px 40px}
.header{text-align:center;padding:12px 0 10px}
.badge{display:inline-block;background:#fff;border-radius:999px;padding:6px 12px;color:#c6659c;font-size:11px;font-weight:800;box-shadow:0 3px 12px #0001}
h1{font-size:36px;line-height:1.05;margin:14px 0 8px}
h1 span{color:#d46fa8}
.lead{font-size:13px;color:#777;margin:0}
.progress{height:7px;background:#fff8;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar{height:100%;width:0;background:#d88ab7;transition:width .2s}
.counter{text-align:center;color:#999;font-size:12px;margin:0 0 10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{border:0;background:#fff;border-radius:22px;min-height:225px;padding:20px 8px;box-shadow:0 8px 26px #00000012;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.person:active{transform:scale(.98)}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#fae5f1;color:#c45d98;font-size:26px;font-weight:900;margin-bottom:14px}
.name{font-size:19px;font-weight:900;text-align:center;line-height:1.25;word-break:keep-all}
.group{font-size:11px;color:#999;margin-top:8px;text-align:center}
.tap{font-size:10px;color:#c58baa;margin-top:10px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.choice{border:0;background:#fff;border-radius:15px;min-height:58px;padding:10px 5px;font-size:13px;font-weight:800;color:#4d4650;box-shadow:0 5px 16px #0000000c;cursor:pointer}
.choice:active{transform:scale(.98);background:#fff0f7}
#result{display:none;text-align:center}
.ranking{text-align:left;margin-top:18px}
.rank{display:flex;align-items:center;gap:10px;background:#fff;border-radius:15px;padding:12px 14px;margin:7px 0;box-shadow:0 4px 15px #0000000b}
.place{width:30px;text-align:center;font-weight:900}
.rankname{font-weight:800}
.ranksub{font-size:10px;color:#999}
.points{margin-left:auto;color:#c6659c;font-size:11px}
.restart{border:0;background:#403947;color:#fff;border-radius:999px;padding:14px 24px;font-weight:900;margin-top:16px;cursor:pointer}
@media(max-width:390px){
 .app{padding:12px 9px 30px}
 h1{font-size:31px}
 .person{min-height:195px}
 .avatar{width:55px;height:55px;font-size:22px}
 .name{font-size:17px}
 .choice{font-size:12px;min-height:55px}
}
</style>
</head>
<body>
<main class="app">
<section id="game">
<div class="header">
<span class="badge">STARTO ENTERTAINMENT</span>
<h1>好き顔<span>♡</span>9選</h1>
<p class="lead">直感で選んで、あなたの好き顔を見つけよう！</p>
</div>
<div class="progress"><div id="bar" class="bar"></div></div>
<p id="counter" class="counter">1 / 35 回</p>
<div class="pair">
<button id="left" class="person" type="button"></button>
<button id="right" class="person" type="button"></button>
</div>
<div class="choices">
<button id="leftBtn" class="choice" type="button">← 左の人が好き</button>
<button id="rightBtn" class="choice" type="button">右の人が好き →</button>
<button id="bothBtn" class="choice" type="button">♡ どっちも好き</button>
<button id="noneBtn" class="choice" type="button">△ どっちもタイプじゃない</button>
</div>
</section>

<section id="result">
<div class="header">
<span class="badge">RESULT</span>
<h1>あなたの<br><span>好き顔ランキング</span> ♡</h1>
<p class="lead">選択結果から9人を選んだよ！</p>
</div>
<div id="ranking" class="ranking"></div>
<button id="restart" class="restart" type="button">もう一回あそぶ ♡</button>
</section>
</main>

<script>
(function(){
"use strict";
const members=[["坂本昌行", "20th Century"], ["長野博", "20th Century"], ["井ノ原快彦", "20th Century"], ["増田貴久", "NEWS"], ["小山慶一郎", "NEWS"], ["加藤シゲアキ", "NEWS"], ["横山裕", "SUPER EIGHT"], ["村上信五", "SUPER EIGHT"], ["丸山隆平", "SUPER EIGHT"], ["安田章大", "SUPER EIGHT"], ["大倉忠義", "SUPER EIGHT"], ["山田涼介", "Hey! Say! JUMP"], ["知念侑李", "Hey! Say! JUMP"], ["中島裕翔", "Hey! Say! JUMP"], ["有岡大貴", "Hey! Say! JUMP"], ["伊野尾慧", "Hey! Say! JUMP"], ["八乙女光", "Hey! Say! JUMP"], ["薮宏太", "Hey! Say! JUMP"], ["増田貴久", "NEWS"], ["藤ヶ谷太輔", "Kis-My-Ft2"], ["玉森裕太", "Kis-My-Ft2"], ["宮田俊哉", "Kis-My-Ft2"], ["二階堂高嗣", "Kis-My-Ft2"], ["横尾渉", "Kis-My-Ft2"], ["佐藤勝利", "timelesz"], ["菊池風磨", "timelesz"], ["松島聡", "timelesz"], ["寺西拓人", "timelesz"], ["原嘉孝", "timelesz"], ["橋本将生", "timelesz"], ["猪俣周杜", "timelesz"], ["篠塚大輝", "timelesz"], ["橋本良亮", "A.B.C-Z"], ["戸塚祥太", "A.B.C-Z"], ["五関晃一", "A.B.C-Z"], ["塚田僚一", "A.B.C-Z"], ["重岡大毅", "WEST."], ["桐山照史", "WEST."], ["中間淳太", "WEST."], ["神山智洋", "WEST."], ["藤井流星", "WEST."], ["濵田崇裕", "WEST."], ["小瀧望", "WEST."], ["髙地優吾", "SixTONES"], ["京本大我", "SixTONES"], ["田中樹", "SixTONES"], ["松村北斗", "SixTONES"], ["ジェシー", "SixTONES"], ["森本慎太郎", "SixTONES"], ["岩本照", "Snow Man"], ["深澤辰哉", "Snow Man"], ["渡辺翔太", "Snow Man"], ["阿部亮平", "Snow Man"], ["佐久間大介", "Snow Man"], ["宮舘涼太", "Snow Man"], ["向井康二", "Snow Man"], ["目黒蓮", "Snow Man"], ["ラウール", "Snow Man"], ["藤原丈一郎", "なにわ男子"], ["西畑大吾", "なにわ男子"], ["大西流星", "なにわ男子"], ["道枝駿佑", "なにわ男子"], ["高橋恭平", "なにわ男子"], ["長尾謙杜", "なにわ男子"], ["大橋和也", "なにわ男子"], ["宮近海斗", "Travis Japan"], ["中村海人", "Travis Japan"], ["七五三掛龍也", "Travis Japan"], ["川島如恵留", "Travis Japan"], ["吉澤閑也", "Travis Japan"], ["松田元太", "Travis Japan"], ["松倉海斗", "Travis Japan"], ["正門良規", "Aぇ! group"], ["末澤誠也", "Aぇ! group"], ["小島健", "Aぇ! group"], ["佐野晶哉", "Aぇ! group"], ["永瀬廉", "King & Prince"], ["髙橋海人", "King & Prince"]];
const MAX_ROUNDS=35;
let scores=[];
let leftIndex=0;
let rightIndex=1;
let round=0;
let locked=false;

function resetScores(){
  scores=new Array(members.length).fill(0);
}
function randomPair(){
  leftIndex=Math.floor(Math.random()*members.length);
  do{rightIndex=Math.floor(Math.random()*members.length);}while(rightIndex===leftIndex);
}
function drawPerson(id,index){
  const el=document.getElementById(id);
  const person=members[index];
  el.innerHTML=
    '<div class="avatar">'+person[0].charAt(0)+'</div>'+
    '<div class="name">'+person[0]+'</div>'+
    '<div class="group">'+person[1]+'</div>'+
    '<div class="tap">タップして選ぶ</div>';
}
function render(){
  drawPerson("left",leftIndex);
  drawPerson("right",rightIndex);
  document.getElementById("counter").textContent=(round+1)+" / "+MAX_ROUNDS+" 回";
  document.getElementById("bar").style.width=((round/MAX_ROUNDS)*100)+"%";
}
function nextPair(){
  if(round>=MAX_ROUNDS){showResult();return;}
  randomPair();
  render();
  locked=false;
}
function vote(type){
  if(locked)return;
  locked=true;
  if(type==="left")scores[leftIndex]+=2;
  else if(type==="right")scores[rightIndex]+=2;
  else if(type==="both"){scores[leftIndex]+=1;scores[rightIndex]+=1;}
  round++;
  if(round>=MAX_ROUNDS)showResult();
  else nextPair();
}
function showResult(){
  document.getElementById("game").style.display="none";
  document.getElementById("result").style.display="block";
  const result=members.map((m,i)=>({name:m[0],group:m[1],score:scores[i],index:i}))
    .sort((a,b)=>b.score-a.score);
  const medals=["🥇","🥈","🥉"];
  document.getElementById("ranking").innerHTML=result.slice(0,9).map(function(x,i){
    return '<div class="rank">'+
      '<div class="place">'+(medals[i]||String(i+1))+'</div>'+
      '<div><div class="rankname">'+x.name+'</div><div class="ranksub">'+x.group+'</div></div>'+
      '<div class="points">'+x.score+' pt</div>'+
      '</div>';
  }).join("");
}
function start(){
  resetScores();
  round=0;
  locked=false;
  document.getElementById("game").style.display="block";
  document.getElementById("result").style.display="none";
  nextPair();
}
document.getElementById("leftBtn").addEventListener("click",function(){vote("left");});
document.getElementById("rightBtn").addEventListener("click",function(){vote("right");});
document.getElementById("bothBtn").addEventListener("click",function(){vote("both");});
document.getElementById("noneBtn").addEventListener("click",function(){vote("none");});
document.getElementById("left").addEventListener("click",function(){vote("left");});
document.getElementById("right").addEventListener("click",function(){vote("right");});
document.getElementById("restart").addEventListener("click",start);
start();
})();
</script>
</body>
</html>
